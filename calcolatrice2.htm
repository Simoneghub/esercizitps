<!DOCTYPE html>
<html>
<head>
<title>Calcolatrice</title>
<style>
body {
    font-family: Arial;
}
#schermo {
    width: 180px;
    height: 30px;
    font-size: 16px;
    text-align: right;
}
button {
    width: 40px;
    height: 40px;
    margin: 2px;
}
</style>
</head>

<body>

<input type="text" id="schermo" disabled><br>

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button onclick="add('/')">/</button><br>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button onclick="add('*')">*</button><br>

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button onclick="add('-')">-</button><br>

<button onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
<button onclick="uguale()">=</button>
<button onclick="add('+')">+</button><br>

<button onclick="c()">C</button>

<script>
let mem = [];

function add(v) {
    mem.push(v);
    document.getElementById("schermo").value += v;
}

function c() {
    mem = [];
    document.getElementById("schermo").value = "";
}

function uguale() {
    let arr = [];
    let n = "";

    for (let i = 0; i < mem.length; i++) {
        if (!isNaN(mem[i]) || mem[i] == ".") {
            n += mem[i];
        } else {
            arr.push(parseFloat(n));
            arr.push(mem[i]);
            n = "";
        }
    }
    if (n != "") arr.push(parseFloat(n));

    for (let i = 0; i < arr.length; i++) {
        if (arr[i] == "*" || arr[i] == "/") {
            let r;
            if (arr[i] == "*") r = arr[i-1] * arr[i+1];
            else r = arr[i-1] / arr[i+1];
            arr.splice(i-1, 3, r);
            i--;
        }
    }

    let ris = arr[0];
    for (let i = 1; i < arr.length; i += 2) {
        if (arr[i] == "+") ris += arr[i+1];
        if (arr[i] == "-") ris -= arr[i+1];
    }

    document.getElementById("schermo").value = ris;
    mem = [];
}
</script>

</body>
</html>
