<!DOCTYPE html>
<html>
<head>
<title>Calcolatrice</title>

<style>
/* stile del body della pagina */
body {
    font-family: Arial;
}

/* stile dello schermo della calcolatrice */
#schermo {
    width: 190px;
    height: 30px;
    text-align: right;   /* testo allineato a destra */
}

/* stile di tutti i bottoni */
button {
    width: 45px;
    height: 35px;
    margin: 2px;
}
</style>
</head>

<body>

<!-- input usato come schermo della calcolatrice -->
<!-- disabled serve per impedire la scrittura manuale -->
<input type="text" id="schermo" disabled><br>

<!-- pulsanti numerici e operatori -->
<!-- onclick richiama la funzione JS passando il valore -->
<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button onclick="add('/')">/</button><br>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button onclick="add('*')">*</button><br>

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button onclick="add('-')">-</button><br>

<button onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
<button onclick="uguale()">=</button>
<button onclick="add('+')">+</button><br>

<!-- pulsanti per operazioni speciali -->
<button onclick="pot()">x²</button>
<button onclick="rad()">√</button>
<button onclick="perc()">%</button>
<button onclick="c()">C</button><br>

<button onclick="sin()">sin</button>
<button onclick="cos()">cos</button>
<button onclick="tan()">tan</button>

<script>
/* array usato come memoria per salvare i valori inseriti */
let mem = [];

/* funzione che aggiunge un valore alla memoria */
function add(v) {
    // inserisce il valore nell'array
    mem.push(v);
    // mostra il valore sullo schermo
    schermo.value += v;
}

/* funzione per cancellare tutto */
function c() {
    // svuota l'array
    mem = [];
    // pulisce lo schermo
    schermo.value = "";
}

/* funzione che legge i numeri presenti nella memoria */
function leggiNumero() {
    let n = "";
    // ciclo per unire i caratteri dell'array in una stringa
    for (let i = 0; i < mem.length; i++) {
        n += mem[i];
    }
    // svuota la memoria
    mem = [];
    // converte la stringa in numero
    return parseFloat(n);
}

/* funzione per il quadrato del numero */
function pot() {
    let n = leggiNumero();
    schermo.value = Math.pow(n, 2);
}

/* funzione per la radice quadrata */
function rad() {
    let n = leggiNumero();
    schermo.value = Math.sqrt(n);
}

/* funzione per la percentuale */
function perc() {
    let n = leggiNumero();
    schermo.value = n / 100;
}

/* funzione per il seno */
function sin() {
    let n = leggiNumero();
    schermo.value = Math.sin(n);
}

/* funzione per il coseno */
function cos() {
    let n = leggiNumero();
    schermo.value = Math.cos(n);
}

/* funzione per la tangente */
function tan() {
    let n = leggiNumero();
    schermo.value = Math.tan(n);
}

/* funzione che calcola il risultato finale */
function uguale() {
    let arr = [];   // array per numeri e operatori
    let num = "";   // variabile temporanea per costruire i numeri

    // ciclo per separare numeri e operatori
    for (let i = 0; i < mem.length; i++) {
        if (!isNaN(mem[i]) || mem[i] == ".") {
            num += mem[i];
        } else {
            arr.push(parseFloat(num));
            arr.push(mem[i]);
            num = "";
        }
    }

    // aggiunge l'ultimo numero se presente
    if (num != "") arr.push(parseFloat(num));

    // gestione di moltiplicazioni e divisioni
    for (let i = 0; i < arr.length; i++) {
        if (arr[i] == "*" || arr[i] == "/") {
            let r = arr[i] == "*" ? arr[i-1] * arr[i+1] : arr[i-1] / arr[i+1];
            arr.splice(i-1, 3, r);
            i--;
        }
    }

    // gestione di addizioni e sottrazioni
    let ris = arr[0];
    for (let i = 1; i < arr.length; i += 2) {
        if (arr[i] == "+") ris += arr[i+1];
        if (arr[i] == "-") ris -= arr[i+1];
    }

    // stampa del risultato
    schermo.value = ris;
    // azzera la memoria
    mem = [];
}
</script>

</body>
</html>
