<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Negozio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      margin: 0;
      padding: 0;
    }

    .navbar {
      background-color: #333;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar h2 {
      margin: 0;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      margin-left: 15px;
    }

    .navbar a:hover {
      text-decoration: underline;
    }

    h1 {
      text-align: center;
      margin-top: 20px;
      color: #333;
    }

    .contenitore {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
      gap: 20px;
    }

    .card {
      background: white;
      border: 1px solid #ccc;
      width: 220px;
      padding: 15px;
      cursor: pointer;
    }

    .card:hover {
      border-color: #333;
    }

    .card img {
      width: 100%;
      height: 150px;
      object-fit: contain;
    }

    .card h3 {
      font-size: 16px;
      margin: 10px 0 5px;
    }

    .card p {
      font-size: 13px;
      color: gray;
      margin: 0 0 5px;
    }

    .card .prezzo {
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }

    .btn-aggiungi {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 8px;
      width: 100%;
      margin-top: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-aggiungi:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <h2 id="nomeNegozio">Negozio</h2>
    <div>
      <a href="carrello.html">🛒 Carrello (<span id="numCarrello">0</span>)</a>
      <a href="ini.html">Configurazione</a>
    </div>
  </div>

  <h1>Catalogo Prodotti</h1>

  <div class="contenitore" id="contenitore">
    <p>Caricamento prodotti...</p>
  </div>

  <script>
    var prodotti = JSON.parse(localStorage.getItem("prodotti") || "[]");
    var carrello = JSON.parse(localStorage.getItem("carrello") || "[]");
    var nome = localStorage.getItem("nomeNegozio") || "Negozio";

    document.getElementById("nomeNegozio").textContent = nome;
    document.getElementById("numCarrello").textContent = carrello.length;

    var contenitore = document.getElementById("contenitore");
    contenitore.innerHTML = "";

    if (prodotti.length == 0) {
      contenitore.innerHTML = "<p>Nessun prodotto trovato. <a href='ini.html'>Vai alla configurazione</a></p>";
    }

    for (var i = 0; i < prodotti.length; i++) {
      var p = prodotti[i];

      var card = document.createElement("div");
      card.className = "card";
      card.setAttribute("data-id", i);

      card.innerHTML =
        "<img src='immagini/" + p.immagine + "' onerror=\"this.style.display='none'; this.nextSibling.style.display='flex'\">" +
        "<div style='display:none; width:100%; height:150px; background:#eee; align-items:center; justify-content:center; font-size:12px; color:#999;'>📷 " + p.immagine + "</div>" +
        "<p style='color:#888; font-size:12px;'>" + p.marca + "</p>" +
        "<h3>" + p.modello + "</h3>" +
        "<p>" + p.descrizione.substring(0, 60) + "...</p>" +
        "<div class='prezzo'>€ " + p.prezzo + "</div>" +
        "<button class='btn-aggiungi' onclick='aggiungi(event, " + i + ")'>Aggiungi al carrello</button>";

      card.onclick = function(e) {
        if (e.target.tagName == "BUTTON") return;
        var id = this.getAttribute("data-id");
        localStorage.setItem("prodottoAperto", id);
        window.location.href = "dettaglio.html";
      };

      contenitore.appendChild(card);
    }

    function aggiungi(e, id) {
      e.stopPropagation();
      carrello.push(id);
      localStorage.setItem("carrello", JSON.stringify(carrello));
      document.getElementById("numCarrello").textContent = carrello.length;
      alert("Prodotto aggiunto al carrello!");
    }
  </script>

</body>
</html>
