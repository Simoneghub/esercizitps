<!DOCTYPE html>
<html>
  <body>
    <h1>Di che generazione sei?</h1>
    <p id="demo"></p>

    <input type="text" id="nome" placeholder="Nome">
    <input type="text" id="cognome" placeholder="Cognome">
    <input type="text" id="indirizzo" placeholder="Indirizzo">
    <input type="text" id="citta" placeholder="Città">
    <input type="text" id="cap" placeholder="CAP (5 cifre)">
    <input type="number" id="anno" min="1900        " max="2025        " placeholder="Anno di Nascita">
    <button onclick="inserisciDati()">Inserisci</button>

    <script>
      function inserisciDati() {
        const nome = document.getElementById('nome').value;
        const cognome = document.getElementById('cognome').value;
        const indirizzo = document.getElementById('indirizzo').value;
        const citta = document.getElementById('citta').value;
        const cap = document.getElementById('cap').value;
        const anno = parseInt(document.getElementById('anno').value);

        let generazione;

        switch (true) {
          case (anno >= 1901 && anno <= 1927):
            generazione = "Greatest Generation";
            break;
          case (anno >= 1928 && anno <= 1945):
            generazione = "Generazione Silenziosa";
            break;
          case (anno >= 1946 && anno <= 1964):
            generazione = "Baby Boomer";
            break;
          case (anno >= 1965 && anno <= 1980):
            generazione = "Generazione X";
            break;
          case (anno >= 1981 && anno <= 1996):
            generazione = "Millennials";
            break;
          case (anno >= 1997 && anno <= 2012):
            generazione = "Generazione Z";
            break;
          case (anno >= 2013):
            generazione = "Generazione Alpha";
            break;
          default:
            generazione = "Valore non valido";
        }

        document.getElementById("demo").innerHTML = 
          nome + " " + cognome + ", nato nel " + anno + 
          ", appartieni alla generazione: <b>" + generazione + "</b>";
      }
    </script>
  </body>
</html>
