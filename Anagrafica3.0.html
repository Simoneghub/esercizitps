<!DOCTYPE html>
<html>
<body>

<h1>Anagrafica 3.0</h1>
<h2>Usando input, oggetti e array</h2>

<!-- input type text per inserire i dati -->
Nome: <input type="text" id="n"><br>
Cognome: <input type="text" id="c"><br>
Età: <input type="text" id="e"><br>
Occhi: <input type="text" id="o"><br><br>

<!-- bottone che richiama la funzione JS -->
<button onclick="inserisci()">Inserisci</button>

<br><br>

<!-- tabella HTML per stampare i dati -->
<table border="1">
  <tr>
    <th>Nome</th>
    <th>Cognome</th>
    <th>Età</th>
    <th>Colore occhi</th>
  </tr>
  <!-- tbody dove verranno inserite le righe -->
  <tbody id="tabella">
  </tbody>
</table>

<script>
  // per creare una collection (array) si usa const nome = []
  const persons = [];

  // funzione che viene eseguita quando si clicca il bottone
  function inserisci() {

    // per creare un oggetto si usa const nome = {
    const p = {
      // si leggono i valori dagli input
      nome: document.getElementById("n").value,
      cognome: document.getElementById("c").value,
      eta: document.getElementById("e").value,
      occhi: document.getElementById("o").value
      // si chiude l'oggetto con }
    };

    // per inserire un oggetto nell'array si usa push()
    persons.push(p);

    // variabile stringa per costruire la tabella
    let testo = "";

    // ciclo for per scorrere tutti gli oggetti dell'array
    for (let i = 0; i < persons.length; i++) {

      // apertura riga tabella
      testo += "<tr>";

      // per mostrare le proprietà dell'oggetto si usa nomeArray[indice].proprietà
      testo += "<td>" + persons[i].nome + "</td>";
      testo += "<td>" + persons[i].cognome + "</td>";
      testo += "<td>" + persons[i].eta + "</td>";
      testo += "<td>" + persons[i].occhi + "</td>";

      // chiusura riga tabella
      testo += "</tr>";
    }

    // si stampa tutto il contenuto nella tabella HTML
    document.getElementById("tabella").innerHTML = testo;
  }
</script>

</body>
</html>
