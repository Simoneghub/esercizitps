<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Dettaglio Prodotto</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      margin: 0;
      padding: 0;
    }

    .navbar {
      background-color: #333;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar h2 {
      margin: 0;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      margin-left: 15px;
    }

    .box {
      background: white;
      border: 1px solid #ccc;
      max-width: 600px;
      margin: 30px auto;
      padding: 25px;
    }

    .box img {
      width: 100%;
      max-height: 280px;
      object-fit: contain;
    }

    .box h2 {
      margin-top: 15px;
    }

    .box p {
      color: gray;
      font-size: 14px;
    }

    .box .prezzo {
      font-size: 26px;
      font-weight: bold;
      color: #333;
      margin: 15px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    table td {
      padding: 8px;
      border: 1px solid #ddd;
      font-size: 14px;
    }

    table td:first-child {
      font-weight: bold;
      background-color: #f5f5f5;
      width: 40%;
    }

    button {
      background-color: #4CAF50;
      color: white;
      padding: 12px;
      border: none;
      width: 100%;
      margin-top: 20px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #45a049;
    }

    .btn-torna {
      background-color: #555;
      margin-top: 10px;
    }

    .btn-torna:hover {
      background-color: #333;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <h2 id="nomeNegozio">Negozio</h2>
    <div>
      <a href="catalogo.html">← Catalogo</a>
      <a href="carrello.html">🛒 Carrello</a>
    </div>
  </div>

  <div class="box" id="box">
    <p>Prodotto non trovato.</p>
  </div>

  <script>
    var prodotti = JSON.parse(localStorage.getItem("prodotti") || "[]");
    var carrello = JSON.parse(localStorage.getItem("carrello") || "[]");
    var id = parseInt(localStorage.getItem("prodottoAperto") || "0");
    var nome = localStorage.getItem("nomeNegozio") || "Negozio";

    document.getElementById("nomeNegozio").textContent = nome;

    if (prodotti.length > 0 && id >= 0 && id < prodotti.length) {
      var p = prodotti[id];

      document.getElementById("box").innerHTML =
        "<img src='immagini/" + p.immagine + "' onerror=\"this.style.display='none'; this.nextSibling.style.display='flex'\">" +
        "<div style='display:none; width:100%; height:280px; background:#eee; align-items:center; justify-content:center; font-size:13px; color:#999;'>📷 " + p.immagine + "</div>" +
        "<h2>" + p.modello + "</h2>" +
        "<div class='prezzo'>€ " + p.prezzo + "</div>" +

        "<table>" +
          "<tr><td>Marca</td><td>" + p.marca + "</td></tr>" +
          "<tr><td>Modello</td><td>" + p.modello + "</td></tr>" +
          "<tr><td>Descrizione</td><td>" + p.descrizione + "</td></tr>" +
          "<tr><td>Prezzo</td><td>€ " + p.prezzo + "</td></tr>" +
        "</table>" +

        "<button onclick='aggiungi()'>Aggiungi al carrello</button>" +
        "<button class='btn-torna' onclick=\"window.location.href='catalogo.html'\">← Torna al catalogo</button>";
    }

    function aggiungi() {
      carrello.push(id);
      localStorage.setItem("carrello", JSON.stringify(carrello));
      alert("Aggiunto al carrello!");
    }
  </script>

</body>
</html>
