<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserisci Dati</title>
</head>
<body>

<h2>Inserisci Dati</h2>

<form id="datiForm">
    Nome: <input type="text" id="nome"><br><br>
    Cognome: <input type="text" id="cognome"><br><br>
    Età: <input type="number" id="eta"><br><br>
    Colore Occhi: <input type="text" id="coloreOcchi"><br><br>
    CAP: <input type="text" id="cap"><br><br>
    Email: <input type="text" id="mail"><br><br>
    <button type="submit">Aggiungi Dati</button>
</form>

<h3>Elenco Dati</h3>
<p id="elencoDati"></p>

<script>
    var collection = [];

    document.getElementById('datiForm').addEventListener('submit', function(e) {
        e.preventDefault();

        var nome = document.getElementById('nome').value.trim();
        var cognome = document.getElementById('cognome').value.trim();
        var eta = document.getElementById('eta').value.trim();
        var coloreOcchi = document.getElementById('coloreOcchi').value.trim();
        var cap = document.getElementById('cap').value.trim();
        var mail = document.getElementById('mail').value.trim();

        // Espressioni regolari
        var controlloNome = /^[a-zA-Z]+$/;
        var controlloCognome = /^[a-zA-Z]+$/;
        var controlloCap = /^[0-9]+$/;
        var controlloEmail = /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,6}$/;

        // Validazioni
        if (!controlloNome.test(nome)) {
            alert("Nome non valido! Solo lettere.");
            return;
        }

        if (!controlloCognome.test(cognome)) {
            alert("Cognome non valido! Solo lettere.");
            return;
        }

        if (!controlloCap.test(cap)) {
            alert("CAP non valido! Solo numeri.");
            return;
        }

        if (!controlloEmail.test(mail)) {
            alert("Email non valida! Deve contenere @ e . con estensione da 2 a 6 caratteri.");
            return;
        }

        // Se tutti i controlli sono superati
        collection.push(
            nome + " " + cognome +
            ", Età: " + eta +
            ", Colore Occhi: " + coloreOcchi +
            ", CAP: " + cap +
            ", Email: " + mail
        );

        document.getElementById('elencoDati').textContent = collection.join(' | ');

        // Reset campi
        document.getElementById('nome').value = '';
        document.getElementById('cognome').value = '';
        document.getElementById('eta').value = '';
        document.getElementById('coloreOcchi').value = '';
        document.getElementById('cap').value = '';
        document.getElementById('mail').value = '';
    });
</script>

</body>
</html>
